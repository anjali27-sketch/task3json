<!DOCTYPE html>
<html>
<head>
    <title>Fetch JSON Data</title>
</head>

<body>

    <h1>User Details</h1>

    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
            </tr>
        </thead>

        <tbody id="userTable">
        </tbody>

    </table>

    <script>

        fetch("users.json")
            .then(response => response.json())
            .then(data => {
                let tableData = "";
                data.forEach(user => {
                    tableData += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.age}</td>
                            <td>${user.city}</td>
                        </tr>
                    `;
                });

                document.getElementById("userTable").innerHTML = tableData;
})
            .catch(error => {
                console.log("Error:", error);
            });
    </script>
</body>
</html>
